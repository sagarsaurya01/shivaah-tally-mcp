<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shivaah Tally — Sign in</title>
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0f1115;color:#e6e8ee;font-family:system-ui,Segoe UI,Roboto,sans-serif;padding:16px}
  .card{width:100%;max-width:380px;background:#171a21;border:1px solid #262b36;border-radius:14px;padding:26px}
  h1{font-size:19px;margin:0 0 2px}
  p.sub{margin:0 0 18px;color:#99a1b3;font-size:13px}
  label{display:block;font-size:13px;color:#aab2c4;margin:12px 0 5px}
  input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid #2d3340;background:#0f1218;color:#fff;font-size:15px}
  button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;background:#2f6bff;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .err{background:#3a1d22;border:1px solid #5c2a31;color:#ffb4bd;padding:9px 11px;border-radius:8px;font-size:13px;margin-bottom:6px;display:none}
  .foot{margin-top:14px;color:#6b7280;font-size:12px;text-align:center}
</style>
</head>
<body>
  <form class="card" id="f" autocomplete="on">
    <h1>Shivaah Tally</h1>
    <p class="sub">Sign in to connect your read-only data access.</p>
    <div class="err" id="err"></div>
    <label>Name</label>
    <input id="user" name="username" autocomplete="username" autofocus>
    <label>Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password">
    <button type="submit" id="go">Sign in</button>
    <div class="foot">Read-only. Every query is logged. Ask your admin if you have no login.</div>
  </form>
<script>
  var SUPABASE_URL = "https://pvixwpksfniwwwktrygw.supabase.co";
  var KEY = "sb_publishable_7sObIkBbeGgJOn7f7LXMbQ_HlIU1cji"; // public key
  var q = new URLSearchParams(location.search);
  var clientId = q.get("client_id") || "";
  var redirectUri = q.get("redirect_uri") || "";
  var codeChallenge = q.get("code_challenge") || "";
  var state = q.get("state") || "";
  var errEl = document.getElementById("err"), go = document.getElementById("go");
  function showErr(m){ errEl.textContent = m; errEl.style.display = "block"; }

  if(!redirectUri){ showErr("This page was opened without a sign-in request. Add the connector in Claude, which will open it for you."); }

  document.getElementById("f").addEventListener("submit", async function(e){
    e.preventDefault();
    errEl.style.display = "none";
    var user = document.getElementById("user").value.trim().toLowerCase();
    var pw = document.getElementById("pw").value;
    if(!user || !pw){ showErr("Enter your name and password."); return; }
    if(!redirectUri){ showErr("Missing sign-in request. Re-add the connector in Claude."); return; }
    go.disabled = true; go.textContent = "Signing in…";
    try{
      var res = await fetch(SUPABASE_URL + "/rest/v1/rpc/oauth_login", {
        method: "POST",
        headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ p_client_id: clientId, p_redirect_uri: redirectUri, p_code_challenge: codeChallenge, p_user: user, p_password: pw })
      });
      var data = await res.json();
      if(!data || !data.ok){ go.disabled = false; go.textContent = "Sign in"; showErr((data && data.error) || "Sign in failed."); return; }
      var sep = redirectUri.indexOf("?") >= 0 ? "&" : "?";
      var dest = redirectUri + sep + "code=" + encodeURIComponent(data.code) + (state ? "&state=" + encodeURIComponent(state) : "");
      location.replace(dest);
    }catch(ex){
      go.disabled = false; go.textContent = "Sign in";
      showErr("Could not reach the server. Check your internet and try again.");
    }
  });
</script>
</body>
</html>
